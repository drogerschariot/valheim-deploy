name: Build apps

# A manual run or a pull request tests, builds the Windows installer, and
# keeps it as an artifact. Only pushing a v* tag publishes a GitHub Release.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -W ignore -m unittest discover tests

  windows-app:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import vhdeploy; print(vhdeploy.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A release whose app reports another version confuses everyone.
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match vhdeploy.__version__ ($version)"
            exit 1
          fi
      - name: Build the app
        run: |
          python -m pip install -r packaging/requirements-windows.txt
          python packaging/build.py windows-app
      - name: Build the installer
        shell: bash
        run: |
          choco install innosetup -y --no-progress >/dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion=${{ steps.version.outputs.version }} packaging/installer.iss
          ls -l dist/ValheimDeploy-Setup.exe
      - name: Install, run a server, quit, uninstall
        run: |
          dist\ValheimDeploy-Setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          python packaging/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ValheimDeploy-Setup
          path: dist/ValheimDeploy-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # A release made on the GitHub website first has no files. Attach them
        # to it rather than failing, or every download link 404s.
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" apps/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" apps/* --repo "$REPO" --title "$TAG" --generate-notes
          fi
